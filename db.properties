# ==============================================================================
# MySQL Database Configuration for Expiry Finder
# ==============================================================================
# Database host (default: localhost)
db.host=localhost

# Database port (default: 3306)
db.port=3306

# Database schema name
db.name=expiry_finder

# MySQL user
db.user=root

# MySQL password
db.password=

# Additional JDBC URL connection parameters
db.params=useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
